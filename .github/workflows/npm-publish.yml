name: NPM Publish

on:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: "20"
            registry-url: "https://registry.npmjs.org"
        - run: npm i -g pnpm
        - run: pnpm i
        - run: cd packages/react && npm version $GITHUB_REF_NAME --no-git-tag-version && cd ../..
        - run: pnpm build
        - run: pnpm --filter @initia/icons-react publish
          env:
            NODE_AUTH_TOKEN: ${{ secrets.NPMJS_ACCESS_TOKEN }}